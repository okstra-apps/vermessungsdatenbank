# Version der Vermessungsdatenbank (Semantic Versioning, CONTRIBUTING.md): zwischen zwei
# Versionen <nächste>-SNAPSHOT, für die Erprobung bei Bedarf Release-Kandidaten <Version>-rc.<n>,
# die Version selbst erst mit der Auslieferung. Steht im Manifest des WAR, in der
# Stückliste, im Startprotokoll und im Namen des Update-Pakets.
vermdbVersion=2.0.0

# Variante von OKLABI und OkstraSqlUtil in WAR und Tomcat-lib: "release" (die Jars des
# Release) oder "intern" (die Module in intern/). Absichtlich nicht hier gesetzt: Ohne
# Angabe gilt "intern", wenn der Ordner vorhanden ist, sonst "release" (build.gradle.kts).
# Abweichend etwa mit -PoklabiVariante=release
#oklabiVariante=release

# Gradle: einfache Konsolenausgabe ohne Fortschrittsanzeige
org.gradle.console=plain
