# Beispieldatensatz vom 11.11.2026: Namensnennung „Landesstraßenbaubehörde Sachsen-Anhalt“
[[annotations]]
path = [
  "testdaten/beispiel.xml",
  "testdaten/beispiel.cte",
  "testdaten/fehler-*.xml",
  "okws/beispiel-wfs.xml",
  "DatenbankLader/src/integrationTest/resources/erwartet/*-beispiel-*.txt",
  "DatenbankLader/src/integrationTest/resources/erwartet/laden-fachbedeutung-*.txt",
  "DatenbankLader/src/integrationTest/resources/erwartet/laden-schema-*.txt",
]
